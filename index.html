<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Obstacle Rush 3D</title>
    <style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --move-btn: clamp(88px, 24vw, 116px);
    --jump-btn: clamp(120px, 32vw, 150px);
    --side-pad: 18px;
}

body {
    background: #050b17;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

button { font-family: inherit; cursor: pointer; }

#game {
    position: relative;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #081329;
}

#gameView { position: absolute; inset: 0; }
#gameView canvas { width: 100%; height: 100%; display: block; }

/* TOP HUD */
.hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: max(16px, env(safe-area-inset-top)) 15px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 5;
    pointer-events: none;
}

.brand { font-size: 13px; font-weight: 900; letter-spacing: 1.5px; color: #fff; }
.brand small {
    display: block;
    margin: 5px 0 0 12px;
    font-size: 8px;
    letter-spacing: 3px;
    color: #00eaff;
}

.dot {
    display: inline-block;
    width: 8px; height: 8px;
    margin-right: 5px;
    border-radius: 50%;
    background: #00eaff;
    box-shadow: 0 0 12px #00eaff;
}

.stats { display: flex; gap: 8px; margin-left: auto; margin-right: 10px; }

.stat {
    min-width: 62px;
    padding: 8px 10px;
    text-align: center;
    background: rgba(7, 20, 43, .8);
    border: 1px solid rgba(0, 234, 255, .3);
    border-radius: 10px;
}
.stat small { display: block; font-size: 8px; color: #91a9c8; letter-spacing: 1px; }
.stat strong { display: block; margin-top: 4px; font-size: 17px; color: #00eaff; }

.pause-btn {
    width: 48px; height: 48px;
    border: 1px solid #00eaff;
    background: rgba(7, 20, 43, .85);
    color: white;
    border-radius: 12px;
    font-size: 20px;
    pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
}

/* NEW-OBSTACLE MESSAGE */
.toast {
    position: absolute;
    top: 96px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(7, 20, 43, .9);
    border: 1px solid #00eaff;
    color: #00eaff;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 1.5px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity .25s;
    pointer-events: none;
}
.toast.show { opacity: 1; }

/* CONTROLS BAR */
.controls {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 20;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 16px;
    padding: 28px var(--side-pad) max(24px, env(safe-area-inset-bottom));
    background: linear-gradient(to top,
        rgba(3, 8, 20, .85) 0%,
        rgba(3, 8, 20, .45) 60%,
        rgba(3, 8, 20, 0) 100%);
    pointer-events: none;
}

.movement {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 14px;
    pointer-events: auto;
}

.control-btn {
    width: var(--move-btn);
    height: var(--move-btn);
    border-radius: 26px;
    border: 3px solid #00eaff;
    background: linear-gradient(160deg, rgba(0, 60, 92, .95), rgba(0, 30, 52, .95));
    color: white;
    font-size: 40px;
    font-weight: bold;
    line-height: 1;
    box-shadow: 0 6px 18px rgba(0, 234, 255, .28), inset 0 2px 8px rgba(255, 255, 255, .15);
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .06s, filter .06s;
}

.jump-btn {
    width: var(--jump-btn);
    height: var(--jump-btn);
    border-radius: 50%;
    border: 4px solid #8afaff;
    background: linear-gradient(145deg, #00eaff, #007bba);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 26px rgba(0, 234, 255, .55), inset 0 3px 10px rgba(255, 255, 255, .3);
    pointer-events: auto;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .06s, filter .06s;
}
.jump-btn span { font-size: 54px; font-weight: 900; line-height: 1; }
.jump-btn small { font-size: 15px; font-weight: bold; letter-spacing: 2px; margin-top: 6px; }

.control-btn:active, .jump-btn:active { transform: scale(0.93); filter: brightness(1.3); }

/* START / GAME OVER SCREEN */
.overlay {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 30;
    background: rgba(3, 8, 20, .68);
    padding: 20px;
}

.panel {
    width: min(340px, 100%);
    padding: 30px 22px;
    text-align: center;
    border: 1px solid rgba(0, 234, 255, .35);
    border-radius: 24px;
    background: rgba(9, 22, 43, .95);
    box-shadow: 0 15px 50px #0008;
}

.game-icon { color: #00eaff; font-size: 38px; margin-bottom: 10px; text-shadow: 0 0 20px #00eaff; }
.eyebrow { color: #00eaff; font-size: 10px; letter-spacing: 3px; margin-bottom: 12px; }
.panel h1 { font-size: 37px; line-height: 1.05; letter-spacing: 2px; }
.panel h1 span { color: #00eaff; }
.panel p:not(.eyebrow) { color: #9db2cc; font-size: 13px; margin: 17px 0 24px; }

#startBtn {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 14px;
    background: #00c9df;
    color: #03101e;
    font-size: 15px;
    font-weight: 900;
    -webkit-tap-highlight-color: transparent;
}

.hint { display: block; margin-top: 20px; color: #7890ae; font-size: 9px; letter-spacing: 2px; }

@media (max-width: 380px) {
    :root { --move-btn: 82px; --jump-btn: 112px; --side-pad: 12px; }
    .movement { gap: 10px; }
}

@media (max-height: 500px) {
    :root { --move-btn: 78px; --jump-btn: 104px; }
    .controls { padding-top: 14px; padding-bottom: 12px; }
    .jump-btn span { font-size: 38px; }
    .jump-btn small { font-size: 12px; margin-top: 3px; }
    .control-btn { font-size: 32px; border-radius: 20px; }
    .panel { padding: 14px; }
    .game-icon { display: none; }
}
    </style>
</head>
<body>

<!-- Shows any error on screen so problems are easy to spot -->
<script>
window.addEventListener("error", function (e) {
    var box = document.getElementById("errBox");
    if (!box) {
        box = document.createElement("div");
        box.id = "errBox";
        box.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:99999;background:#b00020;color:#fff;font:12px/1.4 Arial;padding:8px 10px;white-space:pre-wrap;pointer-events:none";
        document.body.appendChild(box);
    }
    box.textContent += "Error: " + e.message + (e.lineno ? " (line " + e.lineno + ")" : "") + "\n";
});
</script>

<div id="game">

    <div class="hud">
        <div class="brand">
            <span class="dot"></span>
            OBSTACLE RUSH
            <small>3D RUNNER</small>
        </div>

        <div class="stats">
            <div class="stat">
                <small>SCORE</small>
                <strong id="score">0</strong>
            </div>
            <div class="stat">
                <small>BEST</small>
                <strong id="best">0</strong>
            </div>
        </div>

        <button id="pauseBtn" class="pause-btn" aria-label="Pause">Ⅱ</button>
    </div>

    <div id="toast" class="toast"></div>

    <div id="gameView"></div>

    <div class="controls">
        <div class="movement">
            <button id="leftBtn" class="control-btn" aria-label="Move left">◀</button>
            <button id="rightBtn" class="control-btn" aria-label="Move right">▶</button>
        </div>

        <button id="jumpBtn" class="jump-btn" aria-label="Jump">
            <span>↑</span>
            <small>JUMP</small>
        </button>
    </div>

    <div id="overlay" class="overlay">
        <div class="panel">
            <div class="game-icon">◆</div>
            <p class="eyebrow">ENDLESS 3D RUNNER</p>
            <h1 id="title">OBSTACLE<br><span>RUSH</span></h1>
            <p id="subtitle">Run fast. Jump high. Survive.</p>
            <button id="startBtn">START RUNNING →</button>
            <small class="hint">DODGE • JUMP • SURVIVE</small>
        </div>
    </div>

</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// SCENE
const container = document.getElementById("gameView");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x081329);
scene.fog = new THREE.Fog(0x081329, 25, 100);

const BASE_FOV = 65;
const camera = new THREE.PerspectiveCamera(
    BASE_FOV, window.innerWidth / window.innerHeight, 0.1, 150
);
camera.position.set(0, 6, 11);
camera.lookAt(0, 1, -8);

const renderer = new THREE.WebGLRenderer({
    antialias: false,
    powerPreference: "low-power"
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = false;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

// LIGHTS
const hemi = new THREE.HemisphereLight(0x9bdcff, 0x17233c, 2);
scene.add(hemi);
const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(-5, 12, 8);
scene.add(light);

// MATERIALS
const roadMat = new THREE.MeshStandardMaterial({ color: 0x18253c, roughness: 0.8 });
const cyanMat = new THREE.MeshStandardMaterial({ color: 0x00dff5, emissive: 0x004d66, roughness: 0.4 });
const playerMat = new THREE.MeshStandardMaterial({ color: 0x00cce8, metalness: 0.3, roughness: 0.3 });

// ROAD
const road = new THREE.Mesh(new THREE.BoxGeometry(8, 0.3, 120), roadMat);
road.position.set(0, -0.2, -45);
scene.add(road);

function makeBox(w, h, d, material, x, y, z) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
    mesh.position.set(x, y, z);
    scene.add(mesh);
    return mesh;
}

makeBox(0.15, 0.35, 120, cyanMat, -4, 0, -45);
makeBox(0.15, 0.35, 120, cyanMat, 4, 0, -45);

// LANE MARKERS
const markers = [];
const markerMat = new THREE.MeshStandardMaterial({ color: 0x526b8b });

for (let i = 0; i < 20; i++) {
    for (let x of [-1.33, 1.33]) {
        markers.push(makeBox(0.035, 0.025, 2, markerMat, x, -0.025, -i * 6));
    }
}

// FLOOR
const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200),
    new THREE.MeshStandardMaterial({ color: 0x080f20 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.4;
floor.position.z = -40;
scene.add(floor);

// PLAYER
const player = new THREE.Group();
scene.add(player);

const body = new THREE.Mesh(new THREE.BoxGeometry(0.75, 1, 0.5), playerMat);
body.position.y = 1;
player.add(body);

const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.35, 12, 12),
    new THREE.MeshStandardMaterial({ color: 0xffd3a3 })
);
head.position.y = 1.75;
player.add(head);

const armMat = new THREE.MeshStandardMaterial({ color: 0x00a6c8 });
const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.75, 0.25), armMat);
leftArm.position.set(-0.5, 1, 0);
player.add(leftArm);

const rightArm = leftArm.clone();
rightArm.position.x = 0.5;
player.add(rightArm);

const legMat = new THREE.MeshStandardMaterial({ color: 0xeeeeff });
const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.65, 0.3), legMat);
leftLeg.position.set(-0.2, 0.35, 0);
player.add(leftLeg);

const rightLeg = leftLeg.clone();
rightLeg.position.x = 0.2;
player.add(rightLeg);

player.position.set(0, 0, 4);

// GAME VARIABLES
let lane = 1;
let targetX = 0;
let jumpY = 0;
let jumpVelocity = 0;
let obstacles = [];
let score = 0;
let speed = 15;
let spawnTimer = 0;
let running = false;
let paused = false;
let gameOver = false;
let lastTime = 0;
let animationTime = 0;
let shownUnlocks = new Set();

const lanePositions = [-2.5, 0, 2.5];

let best = Number(localStorage.getItem("obstacleBest") || 0);
document.getElementById("best").textContent = best;

// ===== RAIN =====
const RAIN_COUNT = 700;
const rainPos = new Float32Array(RAIN_COUNT * 6);

function resetDrop(i, initial) {
    const x = (Math.random() - 0.5) * 40;
    const y = initial ? Math.random() * 28 : 26 + Math.random() * 4;
    const z = -60 + Math.random() * 75;
    const k = i * 6;

    rainPos[k] = x;
    rainPos[k + 1] = y;
    rainPos[k + 2] = z;
    rainPos[k + 3] = x;
    rainPos[k + 4] = y + 1.1;
    rainPos[k + 5] = z - 0.4;
}

for (let i = 0; i < RAIN_COUNT; i++) resetDrop(i, true);

const rainGeo = new THREE.BufferGeometry();
rainGeo.setAttribute("position", new THREE.BufferAttribute(rainPos, 3));

const rain = new THREE.LineSegments(
    rainGeo,
    new THREE.LineBasicMaterial({
        color: 0x9bdcff,
        transparent: true,
        opacity: 0.45
    })
);
rain.frustumCulled = false;
scene.add(rain);

let flash = 0;
let nextFlash = 6 + Math.random() * 8;

function updateWeather(dt) {
    const fall = 38 * dt;
    const forward = (running ? speed : 12) * 0.45 * dt;

    for (let i = 0; i < RAIN_COUNT; i++) {
        const k = i * 6;

        rainPos[k + 1] -= fall;
        rainPos[k + 4] -= fall;
        rainPos[k + 2] += forward;
        rainPos[k + 5] += forward;

        if (rainPos[k + 1] < 0 || rainPos[k + 2] > 13) resetDrop(i, false);
    }
    rainGeo.attributes.position.needsUpdate = true;

    // Lightning flash
    nextFlash -= dt;
    if (nextFlash <= 0) {
        flash = 1;
        nextFlash = 7 + Math.random() * 10;
    }
    flash = Math.max(0, flash - dt * 3.5);
    hemi.intensity = 2 + flash * 5;
}

// ===== MUSIC =====
const SONG_FILES = ["myson.mp3", "mysong.mp3", "song.mp3"];   // put your exact file name first
let songIndex = 0;

const bgMusic = new Audio(SONG_FILES[0]);
bgMusic.loop = true;
bgMusic.volume = 0.6;

function playMusic() {
    try {
        const p = bgMusic.play();
        if (p && p.catch) p.catch(() => {});
    } catch (e) {}
}

function pauseMusic() {
    try { bgMusic.pause(); } catch (e) {}
}

// If a name isn't found, automatically try the next one
bgMusic.addEventListener("error", () => {
    songIndex++;

    if (songIndex < SONG_FILES.length) {
        bgMusic.src = SONG_FILES[songIndex];
        bgMusic.load();
        playMusic();
    } else {
        alert("Can't find your song. Put its exact file name in SONG_FILES.");
    }
});

playMusic();

document.addEventListener("pointerdown", () => {
    playMusic();
}, { once: true });

// ===== OBSTACLE TYPES =====
// unlock = score needed, weight = how often it appears
const OBSTACLE_TYPES = {
    block:  { w: 1.3, h: 1.4, d: 1.1, color: 0xf12e55, emissive: 0x610b23, unlock: 0,    weight: 5, wide: false },
    low:    { w: 1.3, h: 0.6, d: 0.9, color: 0xffb020, emissive: 0x5a3a00, unlock: 100,  weight: 3, wide: false },
    tall:   { w: 1.3, h: 3.2, d: 1.1, color: 0x9b5cff, emissive: 0x2c0f66, unlock: 400,  weight: 3, wide: false },
    double: { w: 3.8, h: 1.4, d: 1.1, color: 0xff5a2e, emissive: 0x6a1d08, unlock: 900,  weight: 2, wide: true  },
    gate:   { w: 3.8, h: 3.2, d: 1.1, color: 0xc2189b, emissive: 0x580a47, unlock: 1700, weight: 2, wide: true  }
};

const UNLOCK_MESSAGES = {
    low:    "⚠ LOW SPIKES — JUMP!",
    tall:   "⚠ TALL WALLS — DODGE!",
    double: "⚠ DOUBLE BLOCKS!",
    gate:   "⚠ GATES — FIND THE GAP!"
};

// ===== AUTOMATIC DIFFICULTY SETTINGS (change these numbers) =====
// Every level (LEVEL_SIZE points) the game gets faster and the
// obstacle groups come nearer to each other.
const LEVEL_SIZE = 500;          // points per level
const START_SPEED = 20;          // speed at 0 points
const SPEED_PER_LEVEL = 10;       // speed added each level
const MAX_SPEED = 56;            // speed never goes above this
const START_GAP = 28;            // distance between obstacle groups at 0 points
const GAP_PER_LEVEL = 50;         // distance removed each level (groups get nearer)
const MIN_GAP = 12;              // distance never goes below this
const ROW_PER_LEVEL = 0.06;      // extra chance of two blocked lanes each level
const MAX_ROW = 0.8;
const TIGHT_START_LEVEL = 3;     // level where very close groups begin
const TIGHT_PER_LEVEL = 0.05;    // extra chance of very close groups each level
const MAX_TIGHT = 0.5;

// A message is shown at every level
const TIERS = [];
for (let i = 1; i <= 40; i++) {
    TIERS.push({ score: i * LEVEL_SIZE, key: "level-" + i, msg: "⚡ LEVEL " + (i + 1) + " — FASTER!" });
}

// Build the shapes once and reuse them
for (const t of Object.values(OBSTACLE_TYPES)) {
    t.geo = new THREE.BoxGeometry(t.w, t.h, t.d);
    t.stripeGeo = new THREE.BoxGeometry(t.w * 0.7, 0.1, t.d + 0.05);
    t.mat = new THREE.MeshStandardMaterial({
        color: t.color,
        emissive: t.emissive,
        metalness: 0.2,
        roughness: 0.4
    });
}

// TOAST MESSAGE
const toast = document.getElementById("toast");
let toastTimer = null;

function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2000);
}

// OBSTACLES
let safeLane = 1;          // the lane that is always free in the latest wave
let distSinceSpawn = 0;    // how far the road has moved since the last wave
let nextGap = START_GAP;   // distance until the next wave

// Works out the difficulty of the current level from your score.
// Each new level: faster speed, smaller gap, more rows, more close groups.
function getDifficulty() {
    const level = Math.floor(score / LEVEL_SIZE);

    return {
        speed: Math.min(MAX_SPEED, START_SPEED + level * SPEED_PER_LEVEL),
        gap: Math.max(MIN_GAP, START_GAP - level * GAP_PER_LEVEL),
        row: Math.min(MAX_ROW, level * ROW_PER_LEVEL),
        tight: Math.min(MAX_TIGHT, Math.max(0, level - TIGHT_START_LEVEL + 1) * TIGHT_PER_LEVEL)
    };
}

function pickType(wide) {
    const pool = [];

    for (const [name, t] of Object.entries(OBSTACLE_TYPES)) {
        if (t.wide === wide && score >= t.unlock) {
            for (let i = 0; i < t.weight; i++) pool.push(name);
        }
    }

    return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
}

function spawnObstacle(typeName, x) {
    const t = OBSTACLE_TYPES[typeName];
    const obstacle = new THREE.Group();

    const block = new THREE.Mesh(t.geo, t.mat);
    block.position.y = t.h / 2;
    obstacle.add(block);

    const stripe = new THREE.Mesh(t.stripeGeo, cyanMat);
    stripe.position.y = t.h / 2;
    obstacle.add(stripe);

    obstacle.position.set(x, 0, -55);
    obstacle.userData = {
        passed: false,
        hw: t.w / 2,
        hd: t.d / 2,
        h: t.h
    };

    scene.add(obstacle);
    obstacles.push(obstacle);
}

// One "wave" = one obstacle, a row of two, or a wide wall.
// There is always a free lane, and it stays within one lane of the
// previous wave's free lane, so the game gets hard but never impossible.
function spawnWave() {
    const diff = getDifficulty();

    const options = [0, 1, 2].filter(l => Math.abs(l - safeLane) <= 1);
    safeLane = options[Math.floor(Math.random() * options.length)];

    // Wide wall (double / gate) when the free lane is on a side
    if (safeLane !== 1 && Math.random() < 0.35) {
        const wideType = pickType(true);
        if (wideType) {
            spawnObstacle(wideType, safeLane === 0 ? 1.25 : -1.25);
            return;
        }
    }

    const blocked = [0, 1, 2].filter(l => l !== safeLane);

    const lanesToFill = Math.random() < diff.row
        ? blocked
        : [blocked[Math.floor(Math.random() * blocked.length)]];

    for (const l of lanesToFill) {
        spawnObstacle(pickType(false), lanePositions[l]);
    }
}

// Distance until the next wave
function pickGap() {
    const diff = getDifficulty();

    if (Math.random() < diff.tight) return Math.max(11, diff.gap * 0.6);
    return diff.gap * (0.9 + Math.random() * 0.2);
}

function clearObstacles() {
    for (const obstacle of obstacles) scene.remove(obstacle);
    obstacles = [];
}

// CONTROLS
function moveLeft() {
    if (!running || paused) return;
    lane = Math.max(0, lane - 1);
    targetX = lanePositions[lane];
}

function moveRight() {
    if (!running || paused) return;
    lane = Math.min(2, lane + 1);
    targetX = lanePositions[lane];
}

function jump() {
    if (!running || paused) return;
    if (jumpY <= 0.01) jumpVelocity = 11;
}

document.getElementById("leftBtn").addEventListener("pointerdown", e => { e.preventDefault(); moveLeft(); });
document.getElementById("rightBtn").addEventListener("pointerdown", e => { e.preventDefault(); moveRight(); });
document.getElementById("jumpBtn").addEventListener("pointerdown", e => { e.preventDefault(); jump(); });

document.addEventListener("keydown", e => {
    if (e.repeat) return;
    if (e.key === "ArrowLeft" || e.key === "a") moveLeft();
    if (e.key === "ArrowRight" || e.key === "d") moveRight();
    if (e.key === " " || e.key === "ArrowUp") jump();
});

// GAME OVER
function endGame() {
    if (gameOver) return;

    running = false;
    gameOver = true;
    pauseMusic();

    if (score > best) {
        best = score;
        localStorage.setItem("obstacleBest", best);
        document.getElementById("best").textContent = best;
    }

    document.getElementById("title").innerHTML = "GAME<br><span>OVER</span>";
    document.getElementById("subtitle").textContent = "Your final score: " + score;
    document.getElementById("startBtn").textContent = "PLAY AGAIN →";
    document.getElementById("overlay").style.display = "flex";
}
// START GAME
function startGame() {
    clearObstacles();

    score = 0;
    speed = START_SPEED;
    spawnTimer = 0;
    safeLane = 1;
    distSinceSpawn = 0;
    nextGap = START_GAP;
    lane = 1;
    targetX = 0;
    jumpY = 0;
    jumpVelocity = 0;
    shownUnlocks = new Set();

    camera.fov = BASE_FOV;
    camera.updateProjectionMatrix();
    toast.classList.remove("show");

    player.position.set(0, 0, 4);

    document.getElementById("score").textContent = "0";
    document.getElementById("title").innerHTML = "OBSTACLE<br><span>RUSH</span>";
    document.getElementById("subtitle").textContent = "Run fast. Jump high. Survive.";
    document.getElementById("startBtn").textContent = "START RUNNING →";
    document.getElementById("pauseBtn").textContent = "Ⅱ";
    document.getElementById("overlay").style.display = "none";

    paused = false;
    gameOver = false;
    running = true;
    lastTime = 0;

    try { bgMusic.currentTime = 0; } catch (e) {}
    playMusic();
}

// PAUSE
document.getElementById("pauseBtn").addEventListener("click", () => {
    if (gameOver) return;
    if (!running && !paused) return;

    paused = !paused;
    running = !paused;

    const btn = document.getElementById("pauseBtn");
    btn.textContent = paused ? "▶" : "Ⅱ";

    if (paused) {
        pauseMusic();
        document.getElementById("title").textContent = "PAUSED";
        document.getElementById("subtitle").textContent = "Take a short break!";
        document.getElementById("startBtn").textContent = "RESUME →";
        document.getElementById("overlay").style.display = "flex";
    } else {
        playMusic();
        document.getElementById("overlay").style.display = "none";
        lastTime = 0;
    }
});

document.getElementById("startBtn").addEventListener("click", () => {
    if (paused && !gameOver) {
        paused = false;
        running = true;
        lastTime = 0;
        playMusic();
        document.getElementById("overlay").style.display = "none";
        document.getElementById("pauseBtn").textContent = "Ⅱ";
    } else {
        startGame();
    }
});

// UPDATE
function update(delta) {
    if (!running) return;

    const dt = Math.min(delta / 1000, 0.05);
    animationTime += dt;

    // Player movement
    player.position.x += (targetX - player.position.x) * Math.min(1, dt * 12);

    // Jump physics
    if (jumpY > 0 || jumpVelocity > 0) {
        jumpY += jumpVelocity * dt;
        jumpVelocity -= 25 * dt;

        if (jumpY <= 0) {
            jumpY = 0;
            jumpVelocity = 0;
        }
    }

    player.position.y = jumpY;

    // Running animation
    const swing = Math.sin(animationTime * 13) * 0.5;
    leftLeg.rotation.x = swing;
    rightLeg.rotation.x = -swing;
    leftArm.rotation.x = -swing;
    rightArm.rotation.x = swing;
    body.rotation.z = (targetX - player.position.x) * 0.08;

    // Faster every level: ease toward this level's speed
    const levelNow = getDifficulty();
    speed += (levelNow.speed - speed) * Math.min(1, dt * 1.5);

    // Wider view at high speed for a sense of rushing
    camera.fov = BASE_FOV + (speed - 15) * 0.35;
    camera.updateProjectionMatrix();

    // Road movement
    for (const marker of markers) {
        marker.position.z += speed * dt;
        if (marker.position.z > 8) marker.position.z -= 120;
    }

    // Spawn a new wave whenever the road has moved far enough
    distSinceSpawn += speed * dt;
    if (distSinceSpawn >= nextGap) {
        spawnWave();
        distSinceSpawn = 0;
        nextGap = pickGap();
    }

    // Obstacles
    for (const obstacle of obstacles) {
        const prevZ = obstacle.position.z;
        obstacle.position.z += speed * dt;

        const d = obstacle.userData;
        const margin = d.hd + 0.25;

        // Collision (checks the whole distance moved this frame, so
        // fast obstacles can never skip through the player)
        const hitX = Math.abs(player.position.x - obstacle.position.x) < d.hw + 0.3;
        const hitZ = obstacle.position.z >= player.position.z - margin &&
                     prevZ <= player.position.z + margin;
        const clearsIt = jumpY > d.h + 0.05;

        if (hitX && hitZ && !clearsIt) {
            endGame();
            return;
        }

        // Score
        if (obstacle.position.z > player.position.z + 2 && !d.passed) {
            d.passed = true;
            score += 10;
            document.getElementById("score").textContent = score;

            // Announce newly unlocked obstacle types
            for (const [name, t] of Object.entries(OBSTACLE_TYPES)) {
                if (t.unlock > 0 && score >= t.unlock && !shownUnlocks.has(name)) {
                    shownUnlocks.add(name);
                    showToast(UNLOCK_MESSAGES[name]);
                }
            }

            // Announce each new level
            for (const tier of TIERS) {
                if (score >= tier.score && !shownUnlocks.has(tier.key)) {
                    shownUnlocks.add(tier.key);
                    showToast(tier.msg);
                }
            }
        }
    }

    // Remove old obstacles
    obstacles = obstacles.filter(obstacle => {
        if (obstacle.position.z > 12) {
            scene.remove(obstacle);
            return false;
        }
        return true;
    });
}

// LOOP
function animate(time) {
    requestAnimationFrame(animate);

    const delta = lastTime ? time - lastTime : 16.67;
    lastTime = time;

    update(delta);

    // Rain problems should never stop the game
    if (!paused) {
        try { updateWeather(Math.min(delta / 1000, 0.05)); } catch (e) {}
    }

    renderer.render(scene, camera);
}

requestAnimationFrame(animate);

// RESIZE
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
});
</script>
